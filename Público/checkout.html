<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Mariane Moreira Concept</title><link rel="stylesheet" href="/styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="/">Mariane Moreira Concept</a></div></header><main><section><div class="container" style="max-width:800px"><div class="eyebrow">Finalização</div><h1 class="title">Seu pedido</h1><form id="form"><div class="grid" style="grid-template-columns:1fr 1fr"><input class="input" name="name" placeholder="Nome completo" required><input class="input" name="phone" placeholder="WhatsApp/telefone" required><input class="input" name="cpf" placeholder="CPF (opcional)"><input class="input" name="cep" placeholder="CEP"><input class="input" name="state" placeholder="Estado"><input class="input" name="city" placeholder="Cidade"><input class="input" name="neighborhood" placeholder="Bairro"><input class="input" name="street" placeholder="Rua"><input class="input" name="number" placeholder="Número"><input class="input" name="complement" placeholder="Complemento"><input class="input" name="reference" placeholder="Referência"><select class="select" name="paymentMethod"><option>PIX</option><option>Dinheiro</option><option>Cartão de crédito</option><option>Cartão de débito</option><option>Outra</option></select></div><textarea class="textarea" name="notes" placeholder="Observações" style="width:100%;margin-top:12px;min-height:100px"></textarea><input class="input" name="coupon" placeholder="Cupom de desconto" style="width:100%;margin-top:12px"><div id="summary" style="margin:25px 0"></div><button class="btn" type="submit" style="width:100%">Confirmar pedido e abrir WhatsApp</button></form></div></section></main><script>const cart=JSON.parse(localStorage.getItem('mmc-cart')||'[]');const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n);let subtotal=cart.reduce((a,x)=>a+x.price*x.qty,0);document.querySelector('#summary').innerHTML='<b>Itens:</b> '+cart.map(x=>x.name+' · '+x.size+' · '+x.color+' × '+x.qty).join('<br>')+'<br><br><b>Subtotal: '+money(subtotal)+'</b>';document.querySelector('#form').onsubmit=async e=>{e.preventDefault();if(!cart.length)return alert('Carrinho vazio');const f=new FormData(e.target),d=Object.fromEntries(f.entries());const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer:{name:d.name,phone:d.phone,cpf:d.cpf},address:{cep:d.cep,state:d.state,city:d.city,neighborhood:d.neighborhood,street:d.street,number:d.number,complement:d.complement,reference:d.reference},paymentMethod:d.paymentMethod,notes:d.notes,coupon:d.coupon,items:cart})});const x=await r.json();if(!r.ok)return alert(x.error);const lines=['🛍️ NOVO PEDIDO — MARIANE MOREIRA CONCEPT','','👤 CLIENTE:',`Nome: ${d.name}`,`Telefone: ${d.phone}`,'','📦 PRODUTOS:',...cart.map(i=>`- ${i.name} | Tamanho: ${i.size} | Cor: ${i.color} | Qtd: ${i.qty} | Unit.: ${money(i.price)} | Subtotal: ${money(i.price*i.qty)}`),'',`💰 RESUMO:`,`Subtotal: ${money(subtotal)}`,`Cupom: ${d.coupon||'—'}`,`Desconto: ${money(x.discount)}`,`Total: ${money(x.total)}`,'','📍 ENDEREÇO DE ENTREGA:',`CEP: ${d.cep}`,`Rua: ${d.street}`,`Número: ${d.number}`,`Complemento: ${d.complement}`,`Bairro: ${d.neighborhood}`,`Cidade: ${d.city}`,`Estado: ${d.state}`,`Referência: ${d.reference}`,'','💳 PAGAMENTO:',`Forma de pagamento: ${d.paymentMethod}`,'','📝 OBSERVAÇÕES:',d.notes||'—'];localStorage.removeItem('mmc-cart');location.href='https://wa.me/'+x.whatsapp+'?text='+encodeURIComponent(lines.join('\n'))}</script></body></html>
